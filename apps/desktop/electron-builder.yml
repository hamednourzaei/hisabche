appId: com.hisabche.desktop
productName: Hisabche
copyright: Copyright © Hisabche
# Without this, electron-builder derives it from the package name
# (@hisabche/desktop -> "@hisabchedesktop") and AppImage rejects the "@".
executableName: hisabche

# ⚠️ THE BUILD NAME, NOT THE APP NAME.
#
# The workspace package is `@hisabche/desktop`, and electron-builder names its
# intermediates from it. A leading `@` is a real problem for the Linux AppImage
# target (see `executableName` above), so the packaged metadata carries a plain
# name instead. The workspace keeps its scoped name and every
# `--filter=@hisabche/desktop` still works.
#
# ⚠️ This changes what Electron would call the app, and therefore where
# `userData` would DEFAULT to. It is safe only because
# `electron/main/index.ts` pins that path explicitly — without that line this
# one would move every existing installation's SQLite database.
#
# ⚠️ IT IS NOT WHAT FIXED THE NSIS FAILURE. That was a wrong guess: the
# packaging step failed identically with and without the `@`. See
# `differentialPackage` below for the actual cause.
extraMetadata:
  name: hisabche

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json
  # Runtime window icon — the installer icon comes from win.icon, but the
  # BrowserWindow reads this one at runtime.
  - resources/icon.png

  # ── Keep node_modules out of the asar ──────────────────────────────────
  # Vite bundles the renderer, so every React/Radix/recharts package in
  # `dependencies` was shipping twice: once inside out/renderer, once as a raw
  # node_modules tree. That put the asar at 187 MB, and compressing it left a
  # long window in which the NSIS .7z was still being written when
  # electron-builder stat'd it — the ENOENT that failed the build.
  #
  # main/ and preload/ are externalised (externalizeDepsPlugin), so they DO
  # need real modules — but only these. The list is what the sources actually
  # import; re-derive it with:
  #   grep -rhoE "from '[^.]...'" apps/desktop/electron --include=*.ts
  - '!node_modules/**'
  - 'node_modules/better-sqlite3/**'
  - 'node_modules/bindings/**'
  - 'node_modules/file-uri-to-path/**'
  - 'node_modules/electron-updater/**'
  - 'node_modules/@sentry/**'
  - 'node_modules/zod/**'
  - 'node_modules/@hisabche/auth-core/**'

# better-sqlite3 is a native module — it must stay unpacked so the
# .node binding can be dlopen'd from inside the asar.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

npmRebuild: true

win:
  # NOTE: no `icon:` yet. electron-builder needs a SQUARE .ico/.png of at least
  # 256x256; every brand asset in apps/web/public is non-square (logo-icon.png is
  # 1536x1024) and favicon.ico is actually a PNG with the wrong extension.
  # Pointing at either makes the packaging step hang. Add a real square icon at
  # resources/icon.ico and restore this line.
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  # ⚠️ THE PACKAGING STEP FAILED HERE, REPRODUCIBLY.
  #
  #     ⨯ ENOENT: no such file or directory, stat '…-x64.nsis.7z'
  #
  # The archive is written and then, milliseconds later, stat'd by the
  # DIFFERENTIAL PACKAGE step — the one that produces the `.blockmap` used for
  # delta auto-updates. On this machine the file is not visible to that stat
  # when it runs (a newly written archive being scanned by the on-access
  # antivirus is the usual reason on Windows), so the whole build fails after
  # the installer itself has already been assembled.
  #
  # The comment above `files:` records an earlier encounter with the same
  # ENOENT and treated it as an asar-size problem. Shrinking the asar helped
  # but did not remove it: the archive here is 386 kB and it still fails.
  #
  # Delta updates are the only thing lost. A full installer is still produced
  # and `electron-updater` falls back to downloading it whole.
  differentialPackage: false
  oneClick: false
  perMachine: false

  # ⚠️ WINDOWS DEFENDER QUARANTINES `elevate.exe`, AND THAT FAILED THE BUILD.
  #
  #     resources/elevate.exe : Operation did not complete successfully
  #     because the file contains a virus or potentially unwanted software.
  #
  # It is a legitimate electron-builder helper, but Defender classes it as
  # potentially-unwanted software and takes it mid-package. The symptom moved
  # around and never named the cause: first `ENOENT …-x64.nsis.7z` (7-Zip
  # aborted, so the archive was never finished), then `spawn UNKNOWN` from
  # signtool (the file it was handed had been removed underneath it).
  #
  # The alternative was asking every developer to weaken their antivirus. This
  # removes the file instead: the helper exists to request ELEVATION, and this
  # is a per-user installer (`perMachine: false` above) — nothing it installs
  # or updates needs administrator rights, so nothing here uses it.
  #
  # ⚠️ IF `perMachine` EVER BECOMES `true`, OR auto-updates need to elevate,
  # this has to come back. electron-builder ignores the option entirely when
  # `perMachine` is true, so the failure mode would be a silent return of the
  # quarantine rather than a config error.
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.business
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Hardened runtime requires a Developer ID certificate in CI secrets.
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
  artifactName: ${productName}-${version}.${ext}
  synopsis: Hisabche accounting and inventory
  syncDesktopName: true

publish: null
