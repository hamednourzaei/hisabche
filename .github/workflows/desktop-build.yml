name: Desktop Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, test, electron-vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check (renderer + main/preload)
        run: pnpm --filter @hisabche/desktop type-check

      - name: Unit tests (incl. IPC contract)
        run: pnpm --filter @hisabche/desktop test

      # electron-vite build compiles main + preload + renderer — the exact
      # gate for preload/main contract mismatch.
      - name: Build (electron-vite)
        run: pnpm --filter @hisabche/desktop build

  package:
    name: Package ${{ matrix.os }}
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
          - os: macos-latest
            script: package:mac
          - os: ubuntu-latest
            script: package:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # better-sqlite3 is native — rebuild against this Electron ABI.
      - name: Rebuild native modules
        run: pnpm --filter @hisabche/desktop rebuild:native

      - name: Package
        run: pnpm --filter @hisabche/desktop ${{ matrix.script }}
        env:
          # Unsigned until certificates are added to repository secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: hisabche-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
          if-no-files-found: ignore
