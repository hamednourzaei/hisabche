packages:
  - 'apps/*'
  - 'packages/*'
  - 'backend'

# ============================================
# Metro (React Native's bundler) resolves modules by walking node_modules
# directories rather than following pnpm's symlinked store. React Native and
# react-native-web pull in a long tail of helpers — invariant, nullthrows,
# styleq, fbjs and friends — that the mobile app never imports directly, so
# pnpm keeps them nested where Metro cannot see them and bundling fails with
# "Unable to resolve ...".
#
# Hoisting just this set into the root node_modules fixes resolution without
# switching the workspace to node-linker=hoisted, which would give up pnpm's
# strictness for web, desktop and backend too.
#
# Note: this belongs here, not in .npmrc — pnpm 10+ reads these settings from
# pnpm-workspace.yaml and silently ignores the .npmrc form.
# ============================================
publicHoistPattern:
  - '@react-native/*'
  - '@react-native-community/*'
  - '@babel/runtime'
  - 'invariant'
  - 'nullthrows'
  - 'warn-once'
  - 'memoize-one'
  - 'whatwg-fetch'
  - 'base64-js'
  - 'pretty-format'
  - 'styleq'
  - 'inline-style-prefixer'
  - 'fbjs'
  - 'use-sync-external-store'
  - 'abort-controller'
  - 'event-target-shim'
allowBuilds:
  bcrypt: false
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  # v11 (desktop) has no bundled binary; its install script fetches one.
  better-sqlite3@11.10.0: true
  # ⚠️ v13 (root) SHIPS its binaries in `prebuilds/` and declares
  # `"gypfile": false`, but a `binding.gyp` is still in the tarball, so
  # allowing its build makes pnpm run `node-gyp rebuild` — which needs Python.
  # That failure aborts the install BEFORE any `node_modules/.bin` is linked,
  # so jest, vitest and tsc vanish from every package at once.
  better-sqlite3@13.0.3: false
  core-js: true
  detox: true
  dtrace-provider: true
  electron: true
  electron-winstaller: true
  esbuild: true
  lzma-native: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  # eas-cli pulls this in. Its postinstall only generates codegen wrappers for
  # protobufjs's own CLI, which nothing in this repo calls.
  #
  # ⚠️ Leaving the answer blank is NOT neutral. pnpm writes the placeholder
  # itself and then exits 1 on every install until someone decides — and
  # `android:debug` runs an install first, so the local Android build died
  # before Gradle was ever reached, with a pnpm stack trace and no mention of
  # Android anywhere in it.
  protobufjs: false
  # Dev-only: a real Postgres for the backend's concurrency tests (job claiming,
  # scheduler locks). Its postinstall only recreates the symlinks inside its own
  # bundled binaries.
  '@embedded-postgres/windows-x64': true
minimumReleaseAgeExclude:
  - better-sqlite3@13.0.3

# ══════════════════════════════════════════════════════════════════════════
# ⚠️ THE NATIVE ANDROID BUILD DIES 174 CHARACTERS INTO THE STORE PATH.
#
# The failure is `ninja: error: manifest 'build.ninja' still dirty after 100
# tries` — a sentence about ninja's bookkeeping that names neither paths nor
# Windows. `ninja -d explain` gives the real one:
#
#   output ../prefab/…/fbjniConfigVersion.cmake of phony edge
#   with no inputs doesn't exist
#
# The file does exist. ninja stats it as `../prefab/…` relative to a build
# directory 174 characters deep, and Windows applies MAX_PATH to the
# UNCOLLAPSED string — before `..` is resolved:
#
#   174 (cwd) + 1 + 89 (relative part) = 264   > 259 usable
#   collapsed path                     = 251   < 259
#
# That gap is why every check said the file was there: anything that resolves
# the path first sees 251 and reports success, while ninja's own stat sees
# 264 and reports absence. CMake then regenerates, ninja stats again, and the
# two disagree a hundred times.
#
# `LongPathsEnabled` is already 1 on this machine and does not help: it only
# applies to executables that opt in through their manifest, and the ninja
# shipped with Android's CMake 3.22.1 does not.
#
# The 174 characters are almost all pnpm's: `node_modules\.pnpm\` plus a
# store directory name of up to 60. The two settings below shorten both;
# MEASURED after a full `android:debug`, the deepest CMake build dir went from
# 174 to 152, so ninja's stat is 152 + 1 + 89 = 242 — 17 under the limit.
# That margin assumes this repo's location: a clone at a path more than ~17
# characters longer than `C:\Users\hamed\Desktop\hisabche` fails the same way.
# They change only where packages are stored — the dependency graph, the
# lockfile and every import path are unaffected.
#
# ⚠️ The store must stay INSIDE the repo. It was once moved to `C:\pn`, which
# fixed ninja and broke two other things:
#   - Node walks UP from a package to find what it forgot to declare. From
#     `C:\pn\…` it never reaches the repo's `node_modules`, where
#     `publicHoistPattern` puts `@babel/runtime`, `invariant` and the rest —
#     and pnpm does not also hoist those into the store's own `node_modules`.
#     Every mobile Jest suite died on react-native's test environment with
#     `Cannot find module '@babel/runtime/helpers/interopRequireDefault'`.
#   - A drive letter in a committed file is read by Vercel and EAS on Linux.
# ══════════════════════════════════════════════════════════════════════════
virtualStoreDir: '.p'
virtualStoreDirMaxLength: 40
