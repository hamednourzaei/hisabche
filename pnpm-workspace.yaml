packages:
  - 'apps/*'
  - 'packages/*'
  - 'backend'
allowBuilds:
  bcrypt: false
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  better-sqlite3: true
  core-js: true
  detox: true
  dtrace-provider: true
  electron: true
  electron-winstaller: true
  esbuild: true
  lzma-native: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - better-sqlite3@13.0.3
