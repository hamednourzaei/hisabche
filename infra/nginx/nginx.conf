# ==============================================================================
# NOT_DEPLOYED — Reference configuration for Hisabche V75 production architecture.
#
# High-Performance, Low-Resource Nginx Master Configuration.
# Designed for Hisabche single-core architecture (Fastify backend + Next.js web).
# Compatible with low-memory edge devices (2GB-4GB RAM) and multi-core servers.
# ==============================================================================

user nginx nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ─────────────────────────────────────────────────────────────
    log_format hisabche_combined '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time uct="$upstream_connect_time" '
                                'uht="$upstream_header_time" urt="$upstream_response_time" '
                                'cs=$upstream_cache_status';

    access_log /var/log/nginx/hisabche_access.log hisabche_combined buffer=64k flush=5s;
    error_log /var/log/nginx/hisabche_error.log warn;

    # ─── Performance & Low-Memory Tuning ──────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    send_timeout 15s;

    client_body_timeout 15s;
    client_header_timeout 15s;

    # Compact buffers to prevent memory exhaustion on low-spec POS hardware
    client_body_buffer_size 128k;
    client_max_body_size 25m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ─── Gzip Compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # ─── Rate Limiting Zones ─────────────────────────────────────────────────
    # 10MB zone tracks ~160,000 active IP addresses with negligible RAM usage
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;

    # ─── Include Virtual Host Configurations ─────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
