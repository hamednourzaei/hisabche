# ==============================================================================
# NOT_DEPLOYED — Reference virtual host configuration for Hisabche V75.
#
# Production Nginx Virtual Host for Hisabche Single-Core Architecture.
# Directs traffic to Fastify API (port 3001) and Next.js Web (port 3000).
# Implements WebSocket upgrades, edge rate limiting, security headers,
# cache bypass, and emergency maintenance mode routing.
# ==============================================================================

# ─── Upstream Application Definitions ────────────────────────────────────────
upstream hisabche_backend {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream hisabche_web {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ─── WebSocket Connection Upgrade Mapping ─────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── Cache Bypass Mapping ─────────────────────────────────────────────────────
# Allows operators to bypass edge proxy caching via header for real-time debugging
map $http_x_hisabche_bypass_cache $bypass_cache {
    default 0;
    "1"     1;
    "true"  1;
}

# ─── HTTP to HTTPS Redirect ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hisabche.com *.hisabche.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS Primary Production Server ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hisabche.com *.hisabche.com;

    # ─── TLS / SSL Hardening ──────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/hisabche.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hisabche.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/hisabche.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ─── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

    # ─── Emergency Maintenance Mode Gate ──────────────────────────────────────
    # If /var/run/hisabche_maintenance exists, serve 503 unless internal loopback
    # health probes or operator bypass with strong secret token header matches.
    # Replace __MAINTENANCE_BYPASS_TOKEN__ during deployment (never leave "1").
    if (-f /var/run/hisabche_maintenance) {
        set $maintenance 1;
    }
    if ($http_x_hisabche_admin_bypass = "__MAINTENANCE_BYPASS_TOKEN__") {
        set $maintenance 0;
    }
    if ($maintenance = 1) {
        return 503;
    }

    error_page 503 @maintenance;
    location @maintenance {
        default_type application/json;
        return 503 '{"error":"MAINTENANCE_MODE","message":"سرویس حسابچه در حال به‌روزرسانی و نگهداری برنامه‌ریزی‌شده است. لطفاً دقایقی دیگر مجدداً تلاش فرمایید.","retryAfter":300}';
    }

    # ─── Health Probes (Exempt from Rate Limiting) ────────────────────────────
    location = /api/health {
        proxy_pass http://hisabche_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /api/health/db {
        proxy_pass http://hisabche_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Authentication Endpoints (Stricter Rate Limit) ───────────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://hisabche_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ─── Core Backend API ─────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://hisabche_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # ─── Realtime WebSocket Connections ───────────────────────────────────────
    location /ws/ {
        proxy_pass http://hisabche_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep alive for mobile/desktop WebSocket synchronization
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── Next.js Static Asset Caching ─────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://hisabche_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ─── Next.js Frontend Application ─────────────────────────────────────────
    location / {
        proxy_pass http://hisabche_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
