services:
  - type: web
    name: hisabche-api
    runtime: node
    rootDir: .
    buildCommand: bash render-build.sh
    startCommand: bash render-start.sh
    # /ready: 200 only while this instance reaches the database (503 otherwise).
    # Was /health — a path the API does not serve publicly (401).
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
